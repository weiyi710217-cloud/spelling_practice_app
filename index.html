<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互動式單字練習 App - Sunshine Spelling Bee</title>
  <style>
    :root {
      --bg-page: #eceff1;
      --card-bg: #ffffff;
      --header-bg: #d9edf7;
      --header-border: #bce8f1;
      --blue-btn: #005b9f;
      --blue-btn-hover: #00467a;
      --green-btn: #269947;
      --green-btn-hover: #1e7a38;
      --red-btn: #d61d24;
      --red-btn-hover: #ad151b;
      --gray-btn: #e8ecef;
      --gray-btn-hover: #d5dce2;
      --text-main: #2c3e50;
      --text-blue: #0d47a1;
      --text-red: #c62828;
      --border-light: #dce1e5;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 15px 60px;
      background-color: var(--bg-page);
      color: var(--text-main);
    }

    .app-container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 22px 28px 36px;
    }

    .top-notice {
      text-align: center;
      font-size: 15px;
      color: #455a64;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .dashboard-box {
      background-color: var(--header-bg);
      border: 1.5px solid var(--header-border);
      border-radius: 10px;
      padding: 18px 24px;
      margin-bottom: 20px;
    }

    .score-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-blue);
      margin: 0 0 10px 0;
    }

    .wrong-count {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-red);
      margin: 0 0 8px 0;
    }

    .round-progress {
      font-size: 16px;
      font-weight: 600;
      color: #37474f;
      margin: 0 0 16px 0;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-check { background-color: var(--blue-btn); color: #fff; }
    .btn-check:hover:not(:disabled) { background-color: var(--blue-btn-hover); }

    .btn-draw { background-color: var(--green-btn); color: #fff; }
    .btn-draw:hover:not(:disabled) { background-color: var(--green-btn-hover); }

    .btn-wrong { background-color: var(--red-btn); color: #fff; }
    .btn-wrong:hover:not(:disabled) { background-color: var(--red-btn-hover); }

    .btn-secondary {
      background-color: var(--gray-btn);
      color: #37474f;
      border: 1px solid #cfd8dc;
    }
    .btn-secondary:hover:not(:disabled) { background-color: var(--gray-btn-hover); }

    .btn-danger-light {
      background-color: var(--gray-btn);
      color: #c62828;
      border: 1px solid #cfd8dc;
    }
    .btn-danger-light:hover:not(:disabled) { background-color: #f9d8d6; }

    .bank-manager {
      background: #f8fafc;
      border: 1.5px dashed #90caf9;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .bank-manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bank-manager-title {
      font-size: 16px;
      font-weight: 700;
      color: #1565c0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bank-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .api-key-input {
      padding: 9px 12px;
      border: 1px solid #b0bec5;
      border-radius: 6px;
      font-size: 14px;
      width: 240px;
    }

    .model-input {
      padding: 9px 12px;
      border: 1px solid #b0bec5;
      border-radius: 6px;
      font-size: 14px;
      width: 175px;
      background-color: #fff;
      color: #0d47a1;
      font-weight: 600;
    }

    /* 改用 label 直接綁定 file input，100% 避免瀏覽器阻擋點擊 */
    .upload-label-btn {
      background-color: var(--green-btn);
      color: #fff;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s;
    }
    .upload-label-btn:hover { background-color: var(--green-btn-hover); }

    .upload-status {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.5;
      background: #e3f2fd;
      border: 1px solid #90caf9;
      color: #0d47a1;
      font-weight: 600;
      display: none;
      white-space: pre-line;
    }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .question-card {
      background: #fafafa;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 19px;
      line-height: 1.6;
      color: #263238;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .question-card.correct-card { background-color: #f1f8e9; border-color: #81c784; }
    .question-card.wrong-card { background-color: #ffebee; border-color: #e57373; }

    .q-num {
      font-weight: 700;
      color: #607d8b;
      min-width: 36px;
      font-size: 18px;
    }

    .speaker-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #269947;
      border: none;
      color: white;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: transform 0.12s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .speaker-btn:hover { background-color: #1e7a38; transform: scale(1.06); }

    .sentence-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .word-input {
      width: 210px;
      height: 42px;
      border: 1.5px solid #90a4ae;
      border-radius: 6px;
      background-color: #f5f7f8;
      font-size: 18px;
      text-align: center;
      color: #263238;
      padding: 4px 10px;
      outline: none;
      transition: all 0.15s;
    }

    .word-input:focus {
      border-color: #005b9f;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 91, 159, 0.15);
    }

    .word-input.input-correct {
      border-color: #2e7d32;
      background-color: #e8f5e9;
      color: #1b5e20;
      font-weight: 700;
    }

    .word-input.input-wrong {
      border-color: #c62828;
      background-color: #ffebee;
      color: #b71c1c;
      font-weight: 700;
    }

    .hint-badge {
      font-size: 14px;
      color: #546e7a;
      background: #eceff1;
      padding: 3px 9px;
      border-radius: 6px;
      margin-left: 6px;
      cursor: pointer;
      user-select: none;
    }

    .feedback-row {
      width: 100%;
      padding-left: 92px;
      font-size: 15px;
      margin-top: 4px;
      display: none;
    }

    .feedback-correct { color: #2e7d32; font-weight: 700; }
    .feedback-wrong { color: #c62828; font-weight: 700; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #607d8b;
      font-size: 18px;
      background: #fafafa;
      border-radius: 10px;
      border: 1px dashed #cfd8dc;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: #fff;
      max-width: 720px;
      width: 100%;
      border-radius: 12px;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .word-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    .word-table th, .word-table td {
      border: 1px solid #cfd8dc;
      padding: 8px 10px;
      text-align: left;
    }
    .word-table th { background: #eceff1; }
  </style>
</head>

<div class="app-container">
  <div class="top-notice">
    錯題永久保留：只要答錯就會存入錯題庫，直到在錯題模式中答對為止
  </div>

  <!-- Main Dashboard -->
  <div class="dashboard-box">
    <div class="score-title" id="scoreDisplay">得分：0 / 30</div>
    <div class="wrong-count" id="wrongCountDisplay">錯題資料庫：0 題</div>
    <div class="round-progress" id="progressDisplay">本輪進度：0 / 80 題</div>

    <div class="btn-row">
      <button class="btn btn-check" onclick="checkAnswers()">1. 檢查答案</button>
      <button class="btn btn-draw" onclick="draw30Questions()">2. 抽30題 (未練優先)</button>
      <button class="btn btn-wrong" onclick="practiceWrongOnly()">3. 只練錯題庫</button>
      <button class="btn btn-secondary" onclick="resetRoundProgress()">↻ 重置本輪進度</button>
      <button class="btn btn-secondary" onclick="exportWrongBank()">💾 匯出錯題</button>
      <button class="btn btn-danger-light" onclick="clearWrongBank()">🗑️ 清空錯題</button>
    </div>
  </div>

  <!-- Multi-Image Upload & Question Bank Controls -->
  <div class="bank-manager">
    <div class="bank-manager-header">
      <div class="bank-manager-title">
        📸 題庫管理（支援上傳多張單字表圖片，自動壓縮加速並產生小學三年級例句）
      </div>
      <div class="bank-controls">
        <button class="btn btn-secondary" onclick="openBankModal()">📋 檢視目前題庫 (<span id="totalBankBadge">80</span>)</button>
        <button class="btn btn-secondary" onclick="restoreDefaultBank()">🔄 還原預設80題</button>
        <button class="btn btn-danger-light" onclick="clearEntireQuestionBank()">⚠️ 清除題庫</button>
      </div>
    </div>

    <div class="bank-controls">
      <input type="password" id="geminiApiKey" class="api-key-input" placeholder="貼上 Gemini API Key (必填)" />
      <input type="text" id="geminiModelName" class="model-input" value="gemini-3.8-flash" title="可自訂模型名稱" placeholder="模型名稱" />
      
      <!-- 使用 label 直接觸發 input，相容所有手機/平板/電腦瀏覽器 -->
      <label for="imageUploadInput" class="upload-label-btn" id="uploadBtnLabel">
        📤 上傳多張單字圖片 (自動產生小三例句)
      </label>
      <input type="file" id="imageUploadInput" accept="image/*" multiple style="display:none" />

      <button class="btn btn-secondary" onclick="exportFullBank()">⬇️ 匯出題庫 JSON</button>
      <label for="jsonImportInput" class="btn btn-secondary" style="cursor:pointer;">⬆️ 匯入題庫 JSON</label>
      <input type="file" id="jsonImportInput" accept=".json" style="display:none" />
    </div>

    <!-- 即時狀態顯示框 -->
    <div id="uploadStatus" class="upload-status"></div>
  </div>

  <!-- Questions Container -->
  <div id="questionsContainer" class="questions-list"></div>
</div>

<!-- Modal for viewing current Question Bank -->
<div class="modal-backdrop" id="bankModal">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">📚 目前題庫清單（小學三年級例句）</h3>
      <button class="btn btn-secondary" onclick="closeBankModal()">關閉</button>
    </div>
    <div id="bankTableContainer"></div>
  </div>
</div>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互動式單字練習 App - Sunshine Spelling Bee</title>
  <style>
    :root {
      --bg-page: #eceff1;
      --card-bg: #ffffff;
      --header-bg: #d9edf7;
      --header-border: #bce8f1;
      --blue-btn: #005b9f;
      --blue-btn-hover: #00467a;
      --green-btn: #269947;
      --green-btn-hover: #1e7a38;
      --red-btn: #d61d24;
      --red-btn-hover: #ad151b;
      --gray-btn: #e8ecef;
      --gray-btn-hover: #d5dce2;
      --text-main: #2c3e50;
      --text-blue: #0d47a1;
      --text-red: #c62828;
      --border-light: #dce1e5;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 15px 60px;
      background-color: var(--bg-page);
      color: var(--text-main);
    }

    .app-container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 22px 28px 36px;
    }

    .top-notice {
      text-align: center;
      font-size: 15px;
      color: #455a64;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .dashboard-box {
      background-color: var(--header-bg);
      border: 1.5px solid var(--header-border);
      border-radius: 10px;
      padding: 18px 24px;
      margin-bottom: 20px;
    }

    .score-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-blue);
      margin: 0 0 10px 0;
    }

    .wrong-count {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-red);
      margin: 0 0 8px 0;
    }

    .round-progress {
      font-size: 16px;
      font-weight: 600;
      color: #37474f;
      margin: 0 0 16px 0;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-check { background-color: var(--blue-btn); color: #fff; }
    .btn-check:hover { background-color: var(--blue-btn-hover); }

    .btn-draw { background-color: var(--green-btn); color: #fff; }
    .btn-draw:hover { background-color: var(--green-btn-hover); }

    .btn-wrong { background-color: var(--red-btn); color: #fff; }
    .btn-wrong:hover { background-color: var(--red-btn-hover); }

    .btn-secondary {
      background-color: var(--gray-btn);
      color: #37474f;
      border: 1px solid #cfd8dc;
    }
    .btn-secondary:hover { background-color: var(--gray-btn-hover); }

    .btn-danger-light {
      background-color: var(--gray-btn);
      color: #c62828;
      border: 1px solid #cfd8dc;
    }
    .btn-danger-light:hover { background-color: #f9d8d6; }

    .bank-manager {
      background: #f8fafc;
      border: 1.5px dashed #90caf9;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .bank-manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bank-manager-title {
      font-size: 16px;
      font-weight: 700;
      color: #1565c0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bank-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .api-key-input {
      padding: 9px 12px;
      border: 1px solid #b0bec5;
      border-radius: 6px;
      font-size: 14px;
      width: 230px;
    }

    .model-input {
      padding: 9px 12px;
      border: 1px solid #b0bec5;
      border-radius: 6px;
      font-size: 14px;
      width: 170px;
      background-color: #fff;
      color: #0d47a1;
      font-weight: 600;
    }

    .upload-status {
      margin-top: 10px;
      font-size: 14px;
      color: #0d47a1;
      font-weight: 600;
      display: none;
    }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .question-card {
      background: #fafafa;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 19px;
      line-height: 1.6;
      color: #263238;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .question-card.correct-card {
      background-color: #f1f8e9;
      border-color: #81c784;
    }

    .question-card.wrong-card {
      background-color: #ffebee;
      border-color: #e57373;
    }

    .q-num {
      font-weight: 700;
      color: #607d8b;
      min-width: 36px;
      font-size: 18px;
    }

    .speaker-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #269947;
      border: none;
      color: white;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: transform 0.12s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .speaker-btn:hover {
      background-color: #1e7a38;
      transform: scale(1.06);
    }

    .sentence-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .word-input {
      width: 210px;
      height: 42px;
      border: 1.5px solid #90a4ae;
      border-radius: 6px;
      background-color: #f5f7f8;
      font-size: 18px;
      text-align: center;
      color: #263238;
      padding: 4px 10px;
      outline: none;
      transition: all 0.15s;
    }

    .word-input:focus {
      border-color: #005b9f;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 91, 159, 0.15);
    }

    .word-input.input-correct {
      border-color: #2e7d32;
      background-color: #e8f5e9;
      color: #1b5e20;
      font-weight: 700;
    }

    .word-input.input-wrong {
      border-color: #c62828;
      background-color: #ffebee;
      color: #b71c1c;
      font-weight: 700;
    }

    .hint-badge {
      font-size: 14px;
      color: #546e7a;
      background: #eceff1;
      padding: 3px 9px;
      border-radius: 6px;
      margin-left: 6px;
      cursor: pointer;
      user-select: none;
    }

    .feedback-row {
      width: 100%;
      padding-left: 92px;
      font-size: 15px;
      margin-top: 4px;
      display: none;
    }

    .feedback-correct { color: #2e7d32; font-weight: 700; }
    .feedback-wrong { color: #c62828; font-weight: 700; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #607d8b;
      font-size: 18px;
      background: #fafafa;
      border-radius: 10px;
      border: 1px dashed #cfd8dc;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: #fff;
      max-width: 680px;
      width: 100%;
      border-radius: 12px;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .word-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    .word-table th, .word-table td {
      border: 1px solid #cfd8dc;
      padding: 8px 10px;
      text-align: left;
    }
    .word-table th { background: #eceff1; }
  </style>
</head>

<div class="app-container">
  <div class="top-notice">
    錯題永久保留：只要答錯就會存入錯題庫，直到在錯題模式中答對為止
  </div>

  <!-- Main Dashboard -->
  <div class="dashboard-box">
    <div class="score-title" id="scoreDisplay">得分：0 / 30</div>

    <div class="round-progress" id="progressDisplay">本輪進度：0 / 80 題</div>

    <div class="btn-row">
      <button class="btn btn-check" onclick="checkAnswers()">1. 檢查答案</button>
      <button class="btn btn-draw" onclick="draw30Questions()">2. 抽30題 (未練優先)</button>
      <button class="btn btn-wrong" onclick="practiceWrongOnly()">3. 只練錯題庫</button>
      <button class="btn btn-secondary" onclick="resetRoundProgress()">↻ 重置本輪進度</button>
      <button class="btn btn-secondary" onclick="exportWrongBank()">💾 匯出錯題</button>
      <button class="btn btn-danger-light" onclick="clearWrongBank()">🗑️ 清空錯題</button>
    </div>
  </div>

  <!-- Multi-Image Upload & Question Bank Controls -->
  <div class="bank-manager">
    <div class="bank-manager-header">
      <div class="bank-manager-title">
        📸 題庫管理（已內建單字表 #81~#160 共 80 題小學三年級例句，支援上傳多張單字圖片自動擴充題庫）
      </div>
      <div class="bank-controls">
        <button class="btn btn-secondary" onclick="openBankModal()">📋 檢視目前題庫 (<span id="totalBankBadge">80</span>)</button>
        <button class="btn btn-secondary" onclick="restoreDefaultBank()">🔄 還原預設80題</button>
        <button class="btn btn-danger-light" onclick="clearEntireQuestionBank()">⚠️ 清除題庫</button>
      </div>
    </div>

    <div class="bank-controls">
      <input type="password" id="geminiApiKey" class="api-key-input" placeholder="輸入 Gemini API Key" />
      <input type="text" id="geminiModelName" class="model-input" value="gemini-3.8-flash" title="可自訂 Gemini 模型名稱" placeholder="模型名稱 (如 gemini-3.8-flash)" />
      <input type="file" id="imageUploadInput" accept="image/*" multiple style="display:none" onchange="handleMultipleImages(event)" />
      <button class="btn btn-draw" onclick="document.getElementById('imageUploadInput').click()">
        📤 上傳多張單字圖片 (自動產生小三例句)
      </button>
      <button class="btn btn-secondary" onclick="exportFullBank()">⬇️ 匯出題庫 JSON</button>
      <input type="file" id="jsonImportInput" accept=".json" style="display:none" onchange="importBankJson(event)" />
      <button class="btn btn-secondary" onclick="document.getElementById('jsonImportInput').click()">⬆️ 匯入題庫 JSON</button>
    </div>
    <div id="uploadStatus" class="upload-status"></div>
  </div>

  <!-- Questions Container -->
  <div id="questionsContainer" class="questions-list"></div>
</div>

<!-- Modal for viewing current Question Bank -->
<div class="modal-backdrop" id="bankModal">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">📚 目前題庫清單（小學三年級例句）</h3>
      <button class="btn btn-secondary" onclick="closeBankModal()">關閉</button>
    </div>
    <div id="bankTableContainer"></div>
  </div>
</div>

  const STORAGE_KEYS = {
    BANK: 'spelling_bee_question_bank_v1',
    PRACTICED: 'spelling_bee_practiced_ids_v1',
    WRONG: 'spelling_bee_wrong_ids_v1',
    API_KEY: 'spelling_bee_gemini_api_key_v1',
    MODEL_NAME: 'spelling_bee_gemini_model_v1'
  };

  let questionBank = [];
  let practicedIds = new Set();
  let wrongIds = new Set();
  let currentQuiz = [];
  let isWrongMode = false;

  function initApp() {
    const savedKey = localStorage.getItem(STORAGE_KEYS.API_KEY);
    if (savedKey) {
      document.getElementById('geminiApiKey').value = savedKey;
    }
    document.getElementById('geminiApiKey').addEventListener('change', (e) => {
      localStorage.setItem(STORAGE_KEYS.API_KEY, e.target.value.trim());
    });

    const savedModel = localStorage.getItem(STORAGE_KEYS.MODEL_NAME);
    if (savedModel) {
      document.getElementById('geminiModelName').value = savedModel;
    }
    document.getElementById('geminiModelName').addEventListener('change', (e) => {
      localStorage.setItem(STORAGE_KEYS.MODEL_NAME, e.target.value.trim() || 'gemini-3.8-flash');
    });

    const savedBank = localStorage.getItem(STORAGE_KEYS.BANK);
    if (savedBank !== null) {
      try {
        questionBank = JSON.parse(savedBank);
      } catch (e) {
        questionBank = [...DEFAULT_BANK];
      }
    } else {
      questionBank = [...DEFAULT_BANK];
      saveBank();
    }

    try {
      const p = JSON.parse(localStorage.getItem(STORAGE_KEYS.PRACTICED) || '[]');
      practicedIds = new Set(p);
      const w = JSON.parse(localStorage.getItem(STORAGE_KEYS.WRONG) || '[]');
      wrongIds = new Set(w);
    } catch (e) {
      practicedIds = new Set();
      wrongIds = new Set();
    }

    draw30Questions();
  }

  function saveBank() {
    localStorage.setItem(STORAGE_KEYS.BANK, JSON.stringify(questionBank));
    updateDashboard(0, currentQuiz.length);
  }

  function saveProgress() {
    localStorage.setItem(STORAGE_KEYS.PRACTICED, JSON.stringify([...practicedIds]));
    localStorage.setItem(STORAGE_KEYS.WRONG, JSON.stringify([...wrongIds]));
  }

  function updateDashboard(score = 0, total = currentQuiz.length) {
    document.getElementById('scoreDisplay').textContent = `得分：${score} /${total}`;
    document.getElementById('wrongCountDisplay').textContent = `錯題資料庫：${wrongIds.size} 題`;
    document.getElementById('progressDisplay').textContent = `本輪進度：${practicedIds.size} /${questionBank.length} 題`;
    document.getElementById('totalBankBadge').textContent = questionBank.length;
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function draw30Questions() {
    isWrongMode = false;
    if (questionBank.length === 0) {
      currentQuiz = [];
      renderQuestions();
      updateDashboard(0, 0);
      return;
    }

    const unpracticed = questionBank.filter(q => !practicedIds.has(q.word.toLowerCase()));
    const practiced = questionBank.filter(q => practicedIds.has(q.word.toLowerCase()));

    let pool = [...shuffleArray(unpracticed), ...shuffleArray(practiced)];
    currentQuiz = pool.slice(0, Math.min(30, pool.length));

    currentQuiz.forEach(q => practicedIds.add(q.word.toLowerCase()));
    saveProgress();

    renderQuestions();
    updateDashboard(0, currentQuiz.length);
  }

  function practiceWrongOnly() {
    const wrongList = questionBank.filter(q => wrongIds.has(q.word.toLowerCase()));
    if (wrongList.length === 0) {
      alert('目前錯題資料庫為 0 題！太棒了！');
      return;
    }
    isWrongMode = true;
    currentQuiz = shuffleArray(wrongList);
    renderQuestions();
    updateDashboard(0, currentQuiz.length);
  }

  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    if (currentQuiz.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          📭 目前題庫沒有題目。請點擊上方「📤 上傳多張單字圖片」新增題庫，或點擊「🔄 還原預設80題」。
        </div>`;
      return;
    }

    currentQuiz.forEach((item, idx) => {
      const wordLen = item.word.trim().length;
      const parts = item.sentence.split('{blank}');
      const beforeText = parts[0] || '';
      const afterText = parts[1] || '';

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-card-${idx}`;

      card.innerHTML = `
        <div class="q-num">#${idx + 1}</div>
        <button class="speaker-btn" title="點擊聽單字與例句發音" onclick="speakQuestion(${idx})">
          🔊
        </button>
        <div class="sentence-wrap">
          <span>${beforeText}</span>
          <input
            type="text"
            class="word-input"
            id="input-${idx}"
            placeholder="(${wordLen}字)"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            onkeydown="if(event.key==='Enter') checkAnswers();"
          />
          <span>${afterText}</span>
          <span class="hint-badge" title="點擊聽單字發音" onclick="speakWordOnly(${idx})">
            ${item.pos \vert{}\vert{} ''}${item.zh || ''}
          </span>
        </div>
        <div class="feedback-row" id="feedback-${idx}"></div>
      `;

      container.appendChild(card);
    });
  }

  function speakQuestion(idx) {
    const item = currentQuiz[idx];
    if (!item || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const fullSentence = item.sentence.replace('{blank}', item.word);
    const utterWord = new SpeechSynthesisUtterance(item.word);
    utterWord.lang = 'en-US';
    utterWord.rate = 0.85;

    const utterSentence = new SpeechSynthesisUtterance(fullSentence);
    utterSentence.lang = 'en-US';
    utterSentence.rate = 0.9;

    window.speechSynthesis.speak(utterWord);
    window.speechSynthesis.speak(utterSentence);
  }

  function speakWordOnly(idx) {
    const item = currentQuiz[idx];
    if (!item || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterWord = new SpeechSynthesisUtterance(item.word);
    utterWord.lang = 'en-US';
    utterWord.rate = 0.85;
    window.speechSynthesis.speak(utterWord);
  }

  function checkAnswers() {
    if (currentQuiz.length === 0) return;
    let correctCount = 0;

    currentQuiz.forEach((item, idx) => {
      const inputEl = document.getElementById(`input-${idx}`);
      const cardEl = document.getElementById(`q-card-${idx}`);
      const feedbackEl = document.getElementById(`feedback-${idx}`);

      const userAns = (inputEl.value || '').trim().toLowerCase();
      const targetAns = item.word.trim().toLowerCase();

      inputEl.classList.remove('input-correct', 'input-wrong');
      cardEl.classList.remove('correct-card', 'wrong-card');
      feedbackEl.style.display = 'block';

      if (userAns === targetAns) {
        correctCount++;
        inputEl.classList.add('input-correct');
        cardEl.classList.add('correct-card');
        feedbackEl.className = 'feedback-row feedback-correct';
        feedbackEl.textContent = `✓ 答對了！ ${item.word} (${item.pos}${item.zh})`;

        if (isWrongMode) {
          wrongIds.delete(targetAns);
        }
      } else {
        inputEl.classList.add('input-wrong');
        cardEl.classList.add('wrong-card');
        feedbackEl.className = 'feedback-row feedback-wrong';
        feedbackEl.textContent = `✗ 正確答案：${item.word} （${item.pos}${item.zh}）`;

        wrongIds.add(targetAns);
      }
    });

    saveProgress();
    updateDashboard(correctCount, currentQuiz.length);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetRoundProgress() {
    if (!confirm('確定要重置本輪進度嗎？（已練過的題目紀錄將歸零，錯題庫會保留）')) return;
    practicedIds.clear();
    saveProgress();
    draw30Questions();
  }

  function exportWrongBank() {
    const wrongList = questionBank.filter(q => wrongIds.has(q.word.toLowerCase()));
    if (wrongList.length === 0) {
      alert('目前沒有錯題可以匯出！');
      return;
    }
    let content = "No.\tWord\tPOS\t中文解釋\t練習例句\n";
    wrongList.forEach((item, i) => {
      const fullSent = item.sentence.replace('{blank}', `[${item.word}]`);
      content += `${i + 1}\t${item.word}\t${item.pos}\t${item.zh}\t${fullSent}\n`;
    });
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wrong_words_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
  }

  function clearWrongBank() {
    if (wrongIds.size === 0) {
      alert('錯題庫已經是空的！');
      return;
    }
    if (!confirm('確定要清空所有錯題紀錄嗎？')) return;
    wrongIds.clear();
    saveProgress();
    if (isWrongMode) {
      draw30Questions();
    } else {
      updateDashboard(0, currentQuiz.length);
    }
  }

  function clearEntireQuestionBank() {
    if (!confirm('⚠️ 確定要「清除題庫」嗎？\n清除後題庫將變為 0 題，您可以重新上傳單字圖片建立新題庫（或隨時點「還原預設80題」）。')) return;
    questionBank = [];
    practicedIds.clear();
    wrongIds.clear();
    currentQuiz = [];
    saveBank();
    saveProgress();
    renderQuestions();
    updateDashboard(0, 0);
  }

  function restoreDefaultBank() {
    if (!confirm('確定要載入/還原附圖的預設 80 個單字題庫 (#81 ~ #160) 嗎？')) return;
    questionBank = [...DEFAULT_BANK];
    practicedIds.clear();
    saveBank();
    saveProgress();
    draw30Questions();
  }

  function exportFullBank() {
    const blob = new Blob([JSON.stringify(questionBank, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `spelling_question_bank_${questionBank.length}words.json`;
    a.click();
  }

  function importBankJson(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          const existingWords = new Set(questionBank.map(q => q.word.toLowerCase()));
          let added = 0;
          imported.forEach(item => {
            if (item.word && item.sentence && !existingWords.has(item.word.toLowerCase())) {
              questionBank.push(item);
              existingWords.add(item.word.toLowerCase());
              added++;
            }
          });
          saveBank();
          draw30Questions();
          alert(`成功匯入新增 ${added} 個單字！目前題庫共 ${questionBank.length} 題。`);
        }
      } catch (err) {
        alert('JSON 格式錯誤：' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function fileToGenerativePart(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Data = reader.result.split(',')[1];
        resolve({
          inline_data: {
            data: base64Data,
            mime_type: file.type || 'image/jpeg'
          }
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

    const files = Array.from(event.target.files);

    const apiKey = document.getElementById('geminiApiKey').value.trim();

    const statusEl = document.getElementById('uploadStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = `⏳ 正在使用 ${modelName} 辨識 ${files.length} 張單字圖片，並以「小學三年級」程度生成英文挖空例句，請稍候...`;

    try {
      let newItems = [];

        formData.append('model_name', modelName);

        const resp = await fetch('/api/extract-words', {
          method: 'POST',
          body: formData
        });

            newItems = data.words;

          statusEl.style.display = 'none';
          event.target.value = '';
          return;

<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互動式單字練習 App - Sunshine Spelling Bee</title>
  <style>
    :root {
      --bg-page: #eceff1;
      --card-bg: #ffffff;
      --header-bg: #d9edf7;
      --header-border: #bce8f1;
      --blue-btn: #005b9f;
      --blue-btn-hover: #00467a;
      --green-btn: #269947;
      --green-btn-hover: #1e7a38;
      --red-btn: #d61d24;
      --red-btn-hover: #ad151b;
      --gray-btn: #e8ecef;
      --gray-btn-hover: #d5dce2;
      --text-main: #2c3e50;
      --text-blue: #0d47a1;
      --text-red: #c62828;
      --border-light: #dce1e5;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 15px 60px;
      background-color: var(--bg-page);
      color: var(--text-main);
    }

    .app-container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 22px 28px 36px;
    }

    .top-notice {
      text-align: center;
      font-size: 15px;
      color: #455a64;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .dashboard-box {
      background-color: var(--header-bg);
      border: 1.5px solid var(--header-border);
      border-radius: 10px;
      padding: 18px 24px;
      margin-bottom: 20px;
    }

    .score-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-blue);
      margin: 0 0 10px 0;
    }

    .wrong-count {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-red);
      margin: 0 0 8px 0;
    }

    .round-progress {
      font-size: 16px;
      font-weight: 600;
      color: #37474f;
      margin: 0 0 16px 0;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-check { background-color: var(--blue-btn); color: #fff; }
    .btn-check:hover:not(:disabled) { background-color: var(--blue-btn-hover); }

    .btn-draw { background-color: var(--green-btn); color: #fff; }
    .btn-draw:hover:not(:disabled) { background-color: var(--green-btn-hover); }

    .btn-wrong { background-color: var(--red-btn); color: #fff; }
    .btn-wrong:hover:not(:disabled) { background-color: var(--red-btn-hover); }

    .btn-secondary {
      background-color: var(--gray-btn);
      color: #37474f;
      border: 1px solid #cfd8dc;
    }
    .btn-secondary:hover:not(:disabled) { background-color: var(--gray-btn-hover); }

    .btn-danger-light {
      background-color: var(--gray-btn);
      color: #c62828;
      border: 1px solid #cfd8dc;
    }
    .btn-danger-light:hover:not(:disabled) { background-color: #f9d8d6; }

    .bank-manager {
      background: #f8fafc;
      border: 1.5px dashed #90caf9;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .bank-manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bank-manager-title {
      font-size: 16px;
      font-weight: 700;
      color: #1565c0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bank-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .api-key-input {
      padding: 9px 12px;
      border: 1px solid #b0bec5;
      border-radius: 6px;
      font-size: 14px;
      width: 240px;
    }

    .model-input {
      padding: 9px 12px;
      border: 1px solid #b0bec5;
      border-radius: 6px;
      font-size: 14px;
      width: 175px;
      background-color: #fff;
      color: #0d47a1;
      font-weight: 600;
    }

    .upload-label-btn {
      background-color: var(--green-btn);
      color: #fff;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s;
    }
    .upload-label-btn:hover { background-color: var(--green-btn-hover); }

    .upload-status {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.5;
      background: #e3f2fd;
      border: 1px solid #90caf9;
      color: #0d47a1;
      font-weight: 600;
      display: none;
      white-space: pre-line;
    }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .question-card {
      background: #fafafa;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 19px;
      line-height: 1.6;
      color: #263238;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .question-card.correct-card { background-color: #f1f8e9; border-color: #81c784; }
    .question-card.wrong-card { background-color: #ffebee; border-color: #e57373; }

    .q-num {
      font-weight: 700;
      color: #607d8b;
      min-width: 36px;
      font-size: 18px;
    }

    .speaker-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #269947;
      border: none;
      color: white;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: transform 0.12s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .speaker-btn:hover { background-color: #1e7a38; transform: scale(1.06); }

    .sentence-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .word-input {
      width: 210px;
      height: 42px;
      border: 1.5px solid #90a4ae;
      border-radius: 6px;
      background-color: #f5f7f8;
      font-size: 18px;
      text-align: center;
      color: #263238;
      padding: 4px 10px;
      outline: none;
      transition: all 0.15s;
    }

    .word-input:focus {
      border-color: #005b9f;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 91, 159, 0.15);
    }

    .word-input.input-correct {
      border-color: #2e7d32;
      background-color: #e8f5e9;
      color: #1b5e20;
      font-weight: 700;
    }

    .word-input.input-wrong {
      border-color: #c62828;
      background-color: #ffebee;
      color: #b71c1c;
      font-weight: 700;
    }

    .hint-badge {
      font-size: 14px;
      color: #546e7a;
      background: #eceff1;
      padding: 3px 9px;
      border-radius: 6px;
      margin-left: 6px;
      cursor: pointer;
      user-select: none;
    }

    .feedback-row {
      width: 100%;
      padding-left: 92px;
      font-size: 15px;
      margin-top: 4px;
      display: none;
    }

    .feedback-correct { color: #2e7d32; font-weight: 700; }
    .feedback-wrong { color: #c62828; font-weight: 700; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #607d8b;
      font-size: 18px;
      background: #fafafa;
      border-radius: 10px;
      border: 1px dashed #cfd8dc;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: #fff;
      max-width: 720px;
      width: 100%;
      border-radius: 12px;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .word-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    .word-table th, .word-table td {
      border: 1px solid #cfd8dc;
      padding: 8px 10px;
      text-align: left;
    }
    .word-table th { background: #eceff1; }
  </style>
</head>

<div class="app-container">
  <div class="top-notice">
    錯題永久保留：只要答錯就會存入錯題庫，直到在錯題模式中答對為止
  </div>

  <div class="dashboard-box">

    <div class="round-progress" id="progressDisplay">本輪進度：0 / 80 題</div>

    <div class="btn-row">
      <button class="btn btn-check" onclick="checkAnswers()">1. 檢查答案</button>
      <button class="btn btn-draw" onclick="draw30Questions()">2. 抽30題 (未練優先)</button>
      <button class="btn btn-wrong" onclick="practiceWrongOnly()">3. 只練錯題庫</button>
      <button class="btn btn-secondary" onclick="resetRoundProgress()">↻ 重置本輪進度</button>
      <button class="btn btn-secondary" onclick="exportWrongBank()">💾 匯出錯題</button>
      <button class="btn btn-danger-light" onclick="clearWrongBank()">🗑️ 清空錯題</button>
    </div>
  </div>

  <!-- Multi-Image Upload & Question Bank Controls -->
  <div class="bank-manager">
    <div class="bank-manager-header">
      <div class="bank-manager-title">
        📸 題庫管理（純前端直連 API，支援多圖循序排隊防 busy）
      </div>
      <div class="bank-controls">
        <button class="btn btn-secondary" onclick="openBankModal()">📋 檢視目前題庫 (<span id="totalBankBadge">80</span>)</button>
        <button class="btn btn-secondary" onclick="restoreDefaultBank()">🔄 還原預設80題</button>
        <button class="btn btn-danger-light" onclick="clearEntireQuestionBank()">⚠️ 清除題庫</button>
      </div>
    </div>

    <div class="bank-controls">
      <input type="password" id="geminiApiKey" class="api-key-input" placeholder="貼上 Gemini API Key (必填)" />
      <input type="text" id="geminiModelName" class="model-input" value="gemini-3.8-flash" title="可自訂模型名稱" placeholder="模型名稱" />
      
      <label for="imageUploadInput" class="upload-label-btn" id="uploadBtnLabel">
        📤 上傳多張單字圖片 (自動序列處理)
      </label>
      <input type="file" id="imageUploadInput" accept="image/*" multiple style="display:none" />

      <button class="btn btn-secondary" onclick="exportFullBank()">⬇️ 匯出題庫 JSON</button>
      <label for="jsonImportInput" class="btn btn-secondary" style="cursor:pointer;">⬆️ 匯入題庫 JSON</label>
      <input type="file" id="jsonImportInput" accept=".json" style="display:none" />
    </div>

    <div id="uploadStatus" class="upload-status"></div>
  </div>

  <!-- Questions Container -->
  <div id="questionsContainer" class="questions-list"></div>
</div>

<!-- Modal for viewing current Question Bank -->
<div class="modal-backdrop" id="bankModal">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">📚 目前題庫清單（小學三年級例句）</h3>
      <button class="btn btn-secondary" onclick="closeBankModal()">關閉</button>
    </div>
    <div id="bankTableContainer"></div>
  </div>
</div>

  const STORAGE_KEYS = {
    BANK: 'spelling_bee_question_bank_v1',
    PRACTICED: 'spelling_bee_practiced_ids_v1',
    WRONG: 'spelling_bee_wrong_ids_v1',
    API_KEY: 'spelling_bee_gemini_api_key_v1',
    MODEL_NAME: 'spelling_bee_gemini_model_v1'
  };

  let questionBank = [];
  let practicedIds = new Set();
  let wrongIds = new Set();
  let currentQuiz = [];
  let isWrongMode = false;

  function initApp() {
    const savedKey = localStorage.getItem(STORAGE_KEYS.API_KEY);
    if (savedKey) document.getElementById('geminiApiKey').value = savedKey;
    document.getElementById('geminiApiKey').addEventListener('input', (e) => {
      localStorage.setItem(STORAGE_KEYS.API_KEY, e.target.value.trim());
    });

    const savedModel = localStorage.getItem(STORAGE_KEYS.MODEL_NAME);
    if (savedModel) document.getElementById('geminiModelName').value = savedModel;
    document.getElementById('geminiModelName').addEventListener('input', (e) => {
      localStorage.setItem(STORAGE_KEYS.MODEL_NAME, e.target.value.trim() || 'gemini-3.8-flash');
    });

    document.getElementById('imageUploadInput').addEventListener('change', handleMultipleImages);
    document.getElementById('jsonImportInput').addEventListener('change', importBankJson);

    const savedBank = localStorage.getItem(STORAGE_KEYS.BANK);
    if (savedBank !== null) {
      try {
        questionBank = JSON.parse(savedBank);
      } catch (e) {
        questionBank = [...DEFAULT_BANK];
      }
    } else {
      questionBank = [...DEFAULT_BANK];
      saveBank();
    }

    try {
      practicedIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEYS.PRACTICED) || '[]'));
      wrongIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEYS.WRONG) || '[]'));
    } catch (e) {
      practicedIds = new Set();
      wrongIds = new Set();
    }

    draw30Questions();
  }

  function saveBank() {
    localStorage.setItem(STORAGE_KEYS.BANK, JSON.stringify(questionBank));
    updateDashboard(0, currentQuiz.length);
  }

  function saveProgress() {
    localStorage.setItem(STORAGE_KEYS.PRACTICED, JSON.stringify([...practicedIds]));
    localStorage.setItem(STORAGE_KEYS.WRONG, JSON.stringify([...wrongIds]));
  }

  function updateDashboard(score = 0, total = currentQuiz.length) {
    document.getElementById('scoreDisplay').textContent = `得分：${score} / ${total}`;
    document.getElementById('wrongCountDisplay').textContent = `錯題資料庫：${wrongIds.size} 題`;
    document.getElementById('progressDisplay').textContent = `本輪進度：${practicedIds.size} / ${questionBank.length} 題`;
    document.getElementById('totalBankBadge').textContent = questionBank.length;
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function draw30Questions() {
    isWrongMode = false;
    if (questionBank.length === 0) {
      currentQuiz = [];
      renderQuestions();
      updateDashboard(0, 0);
      return;
    }

    const unpracticed = questionBank.filter(q => !practicedIds.has(q.word.toLowerCase()));
    const practiced = questionBank.filter(q => practicedIds.has(q.word.toLowerCase()));

    let pool = [...shuffleArray(unpracticed), ...shuffleArray(practiced)];
    currentQuiz = pool.slice(0, Math.min(30, pool.length));

    currentQuiz.forEach(q => practicedIds.add(q.word.toLowerCase()));
    saveProgress();

    renderQuestions();
    updateDashboard(0, currentQuiz.length);
  }

  function practiceWrongOnly() {
    const wrongList = questionBank.filter(q => wrongIds.has(q.word.toLowerCase()));
    if (wrongList.length === 0) {
      alert('目前錯題資料庫為 0 題！太棒了！');
      return;
    }
    isWrongMode = true;
    currentQuiz = shuffleArray(wrongList);
    renderQuestions();
    updateDashboard(0, currentQuiz.length);
  }

  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    if (currentQuiz.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          📭 目前題庫沒有題目。請在上方填入 Gemini API Key 並點擊「📤 上傳多張單字圖片」新增題庫，或點擊「🔄 還原預設80題」。
        </div>`;
      return;
    }

    currentQuiz.forEach((item, idx) => {
      const wordLen = item.word.trim().length;
      const parts = item.sentence.split('{blank}');
      const beforeText = parts[0] || '';
      const afterText = parts[1] || '';

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-card-${idx}`;

      card.innerHTML = `
        <div class="q-num">#${idx + 1}</div>
        <button class="speaker-btn" title="點擊聽單字與例句發音" onclick="speakQuestion(${idx})">
          🔊
        </button>
        <div class="sentence-wrap">
          <span>${beforeText}</span>
          <input
            type="text"
            class="word-input"
            id="input-${idx}"
            placeholder="(${wordLen}字)"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            onkeydown="if(event.key==='Enter') checkAnswers();"
          />
          <span>${afterText}</span>
          <span class="hint-badge" title="點擊聽單字發音" onclick="speakWordOnly(${idx})">
            ${item.pos || 'word'}
          </span>
        </div>
        <div class="feedback-row" id="feedback-${idx}"></div>
      `;

      container.appendChild(card);
    });
  }

  function speakQuestion(idx) {
    const item = currentQuiz[idx];
    if (!item || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const fullSentence = item.sentence.replace('{blank}', item.word);
    const utterWord = new SpeechSynthesisUtterance(item.word);
    utterWord.lang = 'en-US';
    utterWord.rate = 0.85;

    const utterSentence = new SpeechSynthesisUtterance(fullSentence);
    utterSentence.lang = 'en-US';
    utterSentence.rate = 0.9;

    window.speechSynthesis.speak(utterWord);
    window.speechSynthesis.speak(utterSentence);
  }

  function speakWordOnly(idx) {
    const item = currentQuiz[idx];
    if (!item || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterWord = new SpeechSynthesisUtterance(item.word);
    utterWord.lang = 'en-US';
    utterWord.rate = 0.85;
    window.speechSynthesis.speak(utterWord);
  }

  function checkAnswers() {
    if (currentQuiz.length === 0) return;
    let correctCount = 0;
    let activeCheckedCount = 0;

    currentQuiz.forEach((item, idx) => {
      const inputEl = document.getElementById(`input-${idx}`);
      const cardEl = document.getElementById(`q-card-${idx}`);
      const feedbackEl = document.getElementById(`feedback-${idx}`);

      const userAns = (inputEl.value || '').trim().toLowerCase();
      const targetAns = item.word.trim().toLowerCase();

      if (userAns === '') {
        inputEl.classList.remove('input-correct', 'input-wrong');
        cardEl.classList.remove('correct-card', 'wrong-card');
        feedbackEl.style.display = 'none';
        return;
      }

      activeCheckedCount++;
      inputEl.classList.remove('input-correct', 'input-wrong');
      cardEl.classList.remove('correct-card', 'wrong-card');
      feedbackEl.style.display = 'block';

      if (userAns === targetAns) {
        correctCount++;
        inputEl.classList.add('input-correct');
        cardEl.classList.add('correct-card');
        feedbackEl.className = 'feedback-row feedback-correct';
        feedbackEl.textContent = `✓ 答對了！ ${item.word} (${item.pos} ${item.zh})`;

        if (isWrongMode) {
          wrongIds.delete(targetAns);
        }
      } else {
        inputEl.classList.add('input-wrong');
        cardEl.classList.add('wrong-card');
        feedbackEl.className = 'feedback-row feedback-wrong';
        feedbackEl.textContent = `✗ 正確答案：${item.word} （${item.pos} ${item.zh}）`;

        wrongIds.add(targetAns);
      }
    });

    saveProgress();
    updateDashboard(correctCount, currentQuiz.length);
    if (activeCheckedCount > 0) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function resetRoundProgress() {

  function importBankJson(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          const existingWords = new Set(questionBank.map(q => q.word.toLowerCase()));
          let added = 0;
          imported.forEach(item => {
            if (item.word && item.sentence && !existingWords.has(item.word.toLowerCase())) {
              questionBank.push(item);
              existingWords.add(item.word.toLowerCase());
              added++;
            }
          });
          saveBank();
          draw30Questions();
          alert(`成功匯入新增 ${added} 個單字！目前題庫共 ${questionBank.length} 題。`);
        }
      } catch (err) {
        alert('JSON 格式錯誤：' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function compressImageToPart(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX_SIDE = 1600;
          let w = img.width;
          let h = img.height;
          if (w > MAX_SIDE || h > MAX_SIDE) {
            if (w > h) {
              h = Math.round((h * MAX_SIDE) / w);
              w = MAX_SIDE;
            } else {
              w = Math.round((w * MAX_SIDE) / h);
              h = MAX_SIDE;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          const base64Data = dataUrl.split(',')[1];
          resolve({
            inline_data: {
              data: base64Data,
              mime_type: 'image/jpeg'
            }
          });
        };
        img.onerror = () => reject(new Error(`無法載入圖片: ${file.name}`));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error(`無法讀取檔案: ${file.name}`));
      reader.readAsDataURL(file);
    });
  }

  function parseAiResponseText(rawText) {
    const items = [];
    const lines = rawText.split(/\r?\n/);
    for (const line of lines) {
      const trimmed = line.trim().replace(/^[-*\d.]+\s*/, '');
      if (trimmed.includes('|||')) {
        const parts = trimmed.split('|||').map(s => s.trim());
        if (parts.length >= 4 && parts[0] && parts[3]) {
          items.push({
            word: parts[0],
            pos: parts[1] || '',
            zh: parts[2] || '',
            sentence: parts.slice(3).join(' ')
          });
        }
      }
    }
    if (items.length > 0) return items;

    try {
      const cleanJson = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();
      return JSON.parse(cleanJson);
    } catch (e) {
      const objRegex = /\{\s*"word"\s*:\s*"([^"]+)"[\s\S]*?"pos"\s*:\s*"([^"]*)"[\s\S]*?"zh"\s*:\s*"([^"]*)"[\s\S]*?"sentence"\s*:\s*"([^"]+)"\s*\}/g;
      let match;
      while ((match = objRegex.exec(rawText)) !== null) {
        items.push({
          word: match[1].trim(),
          pos: match[2].trim(),
          zh: match[3].trim(),
          sentence: match[4].trim()
        });
      }
      return items;
    }
  }

  // 純前端直連 API：一張一張依序循序排隊處理，內建 429/503 自動重試與 2 秒安全間隔
  async function handleMultipleImages(event) {
    const fileList = event.target.files;
    if (!fileList || fileList.length === 0) return;

    const files = Array.from(fileList);
    event.target.value = '';

    const statusEl = document.getElementById('uploadStatus');
    statusEl.style.display = 'block';

    const apiKey = document.getElementById('geminiApiKey').value.trim();
    const modelName = (document.getElementById('geminiModelName').value || 'gemini-3.8-flash').trim().replace(/^models\//, '');

    if (!apiKey) {
      statusEl.style.background = '#ffebee';
      statusEl.style.color = '#c62828';
      statusEl.textContent = '❗ 請先在上方「貼上 Gemini API Key」欄位輸入您的金鑰，再點擊上傳圖片！';
      document.getElementById('geminiApiKey').focus();
      return;
    }

    statusEl.style.background = '#e3f2fd';
    statusEl.style.color = '#0d47a1';

    let totalAdded = 0;
    let totalUpdated = 0;

    const wordIndexMap = new Map();
    questionBank.forEach((q, idx) => wordIndexMap.set(q.word.toLowerCase(), idx));

    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusEl.innerHTML = `⏳ 正在循序處理第 <b>${i + 1} / ${files.length}</b> 張圖片（${file.name}）...\n壓縮圖片並向 AI 請求中...`;

        const imagePart = await compressImageToPart(file);

        const promptText = `
你是一位專業的小學三年級英文老師。請仔細辨識這張圖片中的每一個英文單字、詞性(POS)與中文解釋。
並為每一個單字造一個「適合台灣小學三年級學生理解」的簡單、生活化英文例句。
例句中出現該單字的位置請一律用 {blank} 取代（保持原型，方便學生作答）。

【重要格式要求】
請每一行輸出一個單字，欄位之間用三個直線「 ||| 」分隔，格式嚴格如下：
單字 ||| 詞性 ||| 中文解釋 ||| 包含 {blank} 的英文例句

範例：
persistent ||| adj. ||| 堅持不懈的/持續的 ||| The little boy is very {blank} and tries again and again.

請直接輸出單字資料行，不要加上任何說明文字：`;

        let response = null;
        let success = false;
        let lastErr = '';

        for (let attempt = 1; attempt <= 4; attempt++) {
          try {
            const apiUrl = `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
            
            response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: promptText },
                    {
                      inline_data: {
                        mime_type: imagePart.inline_data.mime_type,
                        data: imagePart.inline_data.data
                      }
                    }
                  ]
                }],
                generationConfig: {
                  temperature: 0.2,
                  maxOutputTokens: 8192
                }
              })
            });

            if (response.ok) {
              success = true;
              break;
            } else {
              const errBody = await response.text();
              lastErr = errBody;
              if (response.status === 429 || response.status === 503) {
                statusEl.textContent = `⚠️ 伺服器忙碌中 (Busy)，正在進行第 ${attempt}/4 次自動重試...`;
                await new Promise(r => setTimeout(r, 3000 * attempt));
                continue;
              } else {
                throw new Error(`API 錯誤 (${response.status}): ${errBody}`);
              }
            }
          } catch (netErr) {
            lastErr = netErr.message;
            if (attempt < 4) {
              await new Promise(r => setTimeout(r, 2000));
              continue;
            }
          }
        }

        if (!success) {
          throw new Error(`第 ${i + 1} 張圖片請求失敗: ${lastErr}`);
        }

        const result = await response.json();
        const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const parsedItems = parseAiResponseText(rawText);

        if (parsedItems.length === 0) {
          throw new Error(`第 ${i + 1} 張圖片未能解析出單字。`);
        }

        parsedItems.forEach((item) => {
          const cleanWord = String(item.word || '').trim();
          if (!cleanWord || !item.sentence) return;

          let sent = String(item.sentence).trim();
          if (!sent.includes('{blank}')) {
            const escaped = cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escaped, 'i');
            if (regex.test(sent)) {
              sent = sent.replace(regex, '{blank}');
            } else {
              sent = `${sent} ({blank})`;
            }
          }

          const key = cleanWord.toLowerCase();
          const newEntry = {
            id: questionBank.length + 1,
            word: cleanWord,
            pos: item.pos || '',
            zh: item.zh || '',
            sentence: sent
          };

          if (wordIndexMap.has(key)) {
            const existIdx = wordIndexMap.get(key);
            questionBank[existIdx] = { ...questionBank[existIdx], ...newEntry };
            totalUpdated++;
          } else {
            questionBank.push(newEntry);
            wordIndexMap.set(key, questionBank.length - 1);
            totalAdded++;
          }
        });

        saveBank();
        
        // 每張圖片處理完後刻意暫停 2 秒，完全避免伺服器 busy
        if (i < files.length - 1) {
          await new Promise(r => setTimeout(r, 2000));
        }
      }

      practicedIds.clear();
      saveProgress();
      draw30Questions();

      statusEl.style.background = '#e8f5e9';
      statusEl.style.color = '#1b5e20';
      statusEl.textContent = `✅ 全部 ${files.length} 張圖片處理完畢！\n成功新增 ${totalAdded} 個單字、更新 ${totalUpdated} 個單字例句。\n目前題庫總數：${questionBank.length} 題！`;
    } catch (err) {
      console.error(err);
      statusEl.style.background = '#ffebee';
      statusEl.style.color = '#c62828';
      statusEl.textContent = `❌ 圖片解析失敗：${err.message}`;
    }
  }

  function openBankModal() {
    const modal = document.getElementById('bankModal');
    const container = document.getElementById('bankTableContainer');
    if (questionBank.length === 0) {
      container.innerHTML = '<p>目前題庫是空的。</p>';
    } else {
      let rows = questionBank.map((q, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><strong>${q.word}</strong> (${q.word.length}字)</td>
          <td>${q.pos || ''}</td>
          <td>${q.zh || ''}</td>
          <td>${q.sentence.replace('{blank}', `<u><b>${q.word}</b></u>`)}</td>
        </tr>
      `).join('');
      container.innerHTML = `
        <table class="word-table">
          <thead>
            <tr>
              <th>#</th>
              <th>單字</th>
              <th>詞性</th>
              <th>中文解釋</th>
              <th>小學三年級練習例句</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
    modal.style.display = 'flex';
  }

  function closeBankModal() {
    document.getElementById('bankModal').style.display = 'none';
  }

  window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
